aid: powerlight-technologies
name: PowerLight Technologies
description: 'PowerLight Technologies is an American engineering company headquartered in Kent, Washington
  that develops laser power beaming systems — wireless transmission of kilowatt-level electrical power
  over free space and over optical fiber. Founded as LaserMotive and renamed in 2017, the company builds
  power-over-fiber and free-space laser power links for defense unmanned aerial systems, telecom sites,
  temporary and disaster power, smart-grid applications, and lunar and satellite power distribution,
  including work under DARPA''s LunA-10 program. Its products are hardware energy-transmission systems
  rather than software, and the company publishes no public developer program, API, or machine-readable
  API contract.'
