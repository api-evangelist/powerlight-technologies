  detail: >-
    PowerLight Technologies sells laser power-beaming hardware (power-over-fiber and
    free-space kilowatt laser links) and publishes no developer surface at all — its
    22-page WordPress marketing site has no developer, API, docs or pricing page, no
    api/developer/docs subdomain resolves, every /.well-known/ and spec path 404s, and
    its GitHub org (PowerLightTech) holds only a .github repo and a fork of a third-party
    Sorensen power-supply driver. The only machine-readable surface on the domain is the
    default WordPress core /wp-json/ endpoint, which is the CMS's, not a PowerLight API.
